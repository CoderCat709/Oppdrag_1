<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main</title>
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css')}}">
</head>
<body>
    <header>
        <h1 class="Over">Bestill din drømme reise</h1>   
    </header>
    <nav>
        <a href="{{ url_for('bestill') }}">Kjøp</a>
        <a href="{{ url_for('om') }}">Info</a>
        <a href="{{ url_for('kontakt') }}">Kontakt</a>
        <a href="{{ url_for('main') }}">Hjem</a>
    </nav>
    <main>
        <div class="produkt">
            {% for tur, bilde in destinations %}
                <a class="produkter" href="{{ url_for('bestill') }}">
                    <img src="{{ url_for('static', filename='Images/' ~ bilde) }}"
                        alt="Bilde for {{ tur }}">
                    <span>{{ tur }}</span>
                </a>
            {% endfor %}
        </div>
    </main>
    <footer>
        <a href="{{ url_for('kontakt') }}">Kontakt oss</a>
        <p class="foot">Eid og oppretholdt av Henrik Huseby</p>
    </footer>
    
</body>
</html>
